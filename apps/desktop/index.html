<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>掘掘熊 · DigBear</title>
    <!-- 预置默认主题变量，避免首屏闪烁；运行时会由 src/theme.ts 接管 -->
    <style id="theme-vars">
      html:root {
        --paper: #faf5ec;
        --paper-deep: #efe3d0;
        --card: #fffdf8;
        --ink: #2e2440;
        --ink-soft: #584a6d;
        --muted: #8a7ea0;
        --fur: #b97b43;
        --fur-light: #f0d3a7;
        --honey: #f0a830;
        --honey-deep: #cf8b16;
        --berry: #e2553c;
        --berry-deep: #b93a24;
        --leaf: #4f9e8c;
        --sky: #6fa8c7;
        --line: #2e2440;
        --line-soft: #ded4e6;
      }
    </style>
  </head>
  <body>
    <script>
      // Native-app feel: no web context menu anywhere.
      document.addEventListener("contextmenu", (event) => event.preventDefault(), { capture: true });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
