name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS + MSI installers
        run: pnpm build:desktop:windows

      - name: Collect installers
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi |
            ForEach-Object { Copy-Item $_.FullName -Destination $out }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding utf8 dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: digbear-windows
          path: |
            dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object { $_.FullName }
          if (-not (gh release view $tag)) {
            gh release create $tag --title "DigBear $tag" --notes "Windows 安装包（NSIS / MSI）。应用未做代码签名，首次运行请在 Windows 安全中心选择“更多信息 → 仍要运行”。"
          }
          gh release upload $tag @files dist/SHA256SUMS --clobber

  macos:
    name: Build macOS package
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS package
        env:
          TAURI_TARGET: universal-apple-darwin
        run: pnpm package:macos

      - name: Checksums
        run: shasum -a 256 dist/DigBear-macOS.pkg dist/DigBear-macOS.zip > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: digbear-macos
          path: |
            dist/DigBear-macOS.pkg
            dist/DigBear-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DigBear $TAG" \
              --notes "macOS 安装包。应用未经过 Apple 公证，首次打开请按 docs/INSTALL-macOS.md 放行。"
          fi
          gh release upload "$TAG" \
            dist/DigBear-macOS.pkg \
            dist/DigBear-macOS.zip \
            dist/SHA256SUMS \
            --clobber
