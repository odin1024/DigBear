name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS + MSI installers
        run: pnpm build:desktop:windows

      - name: Collect installers
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi |
            ForEach-Object { Copy-Item $_.FullName -Destination $out }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Package browser extension
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Compress-Archive -Path "apps/extension/*" -DestinationPath "dist/DigBear_extension_v$version.zip" -Force

      - name: Checksums
        shell: pwsh
        run: |
          # 排除 SHA256SUMS 自己，并且用 ASCII 写：带 BOM 会让 sha256sum 校验失败。
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: digbear-windows
          path: |
            dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object { $_.FullName }
          if (-not (gh release view $tag)) {
            $notesFile = "docs/releases/$tag.md"
            if (Test-Path $notesFile) {
              gh release create $tag --title "掘掘熊 DigBear $tag" --notes-file $notesFile
            } else {
              gh release create $tag --title "DigBear $tag" --notes "Windows 安装包（NSIS / MSI）。应用未做代码签名，首次运行请在 Windows 安全中心选择“更多信息 → 仍要运行”。"
            }
          }
          gh release upload $tag @files dist/SHA256SUMS --clobber
