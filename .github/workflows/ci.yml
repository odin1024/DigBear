name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 目前只发布 Windows。macOS runner 排队慢且会因超时把整个 workflow
        # 拖成 cancelled（Windows 那边其实全绿），所以先只留 Windows。
        os: [windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm check-version

      - name: Build workspaces
        run: pnpm build

      - name: Rust tests
        run: pnpm test:rust

      # 依赖安全：构建期依赖里的已知漏洞一并拦下
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # 格式与 lint：项目自己声明了 lint:rust，就在 CI 里真的跑起来，
      # 免得格式债和 clippy 警告再慢慢堆积。
      - name: Rust format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
